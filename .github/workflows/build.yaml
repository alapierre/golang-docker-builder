name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_NAME: lapierre/golang-docker-builder
      IMAGE_VERSION: 1.26.4-alpine3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE_NAME}:pr-${{ matrix.suffix }}" \
            --load .
      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE_NAME}:${IMAGE_VERSION}-${{ matrix.suffix }}" \
            --tag "${IMAGE_NAME}:latest-${{ matrix.suffix }}" \
            --push .

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: lapierre/golang-docker-builder
      IMAGE_VERSION: 1.26.4-alpine3
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_VERSION}" \
            "${IMAGE_NAME}:${IMAGE_VERSION}-amd64" \
            "${IMAGE_NAME}:${IMAGE_VERSION}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest-amd64" \
            "${IMAGE_NAME}:latest-arm64"
